<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Классификатор ирисов Фишера</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }
        h2 { margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; }
        input[type="number"] {
            width: 100%;
            padding: 6px 8px;
            margin: 4px 0 14px 0;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 22px;
            font-size: 15px;
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #256428; }
        .result {
            margin-top: 24px;
            padding: 14px 16px;
            background: #e8f5e9;
            border: 1px solid #2e7d32;
            border-radius: 4px;
            font-size: 16px;
        }
        .result strong { color: #1b5e20; }
    </style>
</head>
<body>
    <h2>Введите параметры цветка</h2>

    <form method="post" action="/predict">
        <label for="sepal_length">Длина чашелистика (см)</label>
        <input type="number" step="0.1" min="0" id="sepal_length"
               name="sepal_length" required value="5.1">

        <label for="sepal_width">Ширина чашелистика (см)</label>
        <input type="number" step="0.1" min="0" id="sepal_width"
               name="sepal_width" required value="3.5">

        <label for="petal_length">Длина лепестка (см)</label>
        <input type="number" step="0.1" min="0" id="petal_length"
               name="petal_length" required value="1.4">

        <label for="petal_width">Ширина лепестка (см)</label>
        <input type="number" step="0.1" min="0" id="petal_width"
               name="petal_width" required value="0.2">

        <button type="submit">Отправить</button>
    </form>

    <div class="result">
        <strong>Результат:</strong> {{ result }}
    </div>
</body>
</html>
